name: Deploy GLAVAT STUDIO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api/server.js
      - name: Prepare isolated API test workspace
        run: |
          mkdir -p "$RUNNER_TEMP/glavat-api-test"
          cp api/package.json api/server.js api/server.test.js "$RUNNER_TEMP/glavat-api-test/"
      - name: Install API dependencies
        run: npm install --prefix "$RUNNER_TEMP/glavat-api-test" --no-audit --no-fund
      - name: Test API validation
        run: npm test --prefix "$RUNNER_TEMP/glavat-api-test"
      - name: Prepare public Pages files
        run: |
          mkdir -p "$RUNNER_TEMP/glavat-pages"
          cp index.html app.js styles.css .nojekyll "$RUNNER_TEMP/glavat-pages/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/glavat-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check live API end to end
        env:
          API_BASE: https://glavat-studio-api-production.up.railway.app
        run: node api/smoke-test.js
